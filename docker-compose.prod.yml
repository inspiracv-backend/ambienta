# Entorno de PRODUCCIÓN de Ambienta.
#
#   cp .env.example .env      → y completar con valores REALES
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Diferencias clave con el compose de desarrollo:
#   · Imágenes construidas (no hot reload, no devDependencies, usuario no-root).
#   · Postgres y Redis NO publican puertos al host: solo accesibles desde la red
#     interna de Docker. Para conectarse a la base hay que hacer túnel SSH.
#   · Caddy como reverse proxy con HTTPS automático (Let's Encrypt).
#   · Todos los secretos vienen de .env — este archivo no contiene ninguno.
#   · Redis con contraseña y persistencia AOF.
#
# Requisitos previos en el servidor:
#   1. DNS: los dominios de DOMAIN_WEB y DOMAIN_API apuntando (registro A) a la
#      IP pública del servidor — Let's Encrypt valida por HTTP y falla si no.
#   2. Puertos 80 y 443 abiertos en el firewall.

name: ambienta-prod

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB en .env}
    # Sin `ports`: la base NO se expone a internet. Acceso solo vía red interna
    # o túnel SSH (`ssh -L 5432:localhost:5432 usuario@servidor`).
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Archivos por separado (no el directorio): ver nota en docker-compose.yml.
      # Init en orden: extensiones → esquema (52 tablas + RLS) → clerk → permisos → catalogos.
      #
      # 04_clerk_auth NO es opcional: crea users.clerk_id, sin la cual el webhook
      # que sincroniza usuarios desde Clerk falla contra su propio esquema.
      # Debe estar en los tres lados — aca, en docker-compose.yml y en db/README.
      #
      # 02_seed (datos de demo) NO se monta a proposito: produccion arranca vacia.
      #
      # **Esta lista quedo cuatro migraciones atras hasta el 22-ago-2026** y
      # nadie lo noto porque este archivo nunca se ejecuto: no hay servidor
      # aprovisionado. Faltaban 06, 07, 08 y 09 — entre ellas la que crea el rol
      # de la aplicacion. Al agregar un `db/NN_*.sql`, va en los CINCO lugares:
      # los dos compose, `db/run.sh`, `db/README.md` y el bucle de `ci.yml`.
      - ./infra/postgres/init/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - ./db/04_clerk_auth.sql:/docker-entrypoint-initdb.d/03-clerk.sql:ro
      - ./db/05_user_permissions.sql:/docker-entrypoint-initdb.d/04-permisos.sql:ro
      - ./db/06_ticket_number.sql:/docker-entrypoint-initdb.d/05-ticket-number.sql:ro
      # 07 crea `ambienta_app`, el rol con el que se conecta la API y que NO
      # puede saltarse RLS. **Sin este archivo el despliegue no arranca**, y si
      # arrancara con el superusuario el aislamiento entre empresas no
      # existiria. Faltaba aca; ver el comentario de abajo.
      - ./db/07_rol_aplicacion.sql:/docker-entrypoint-initdb.d/06-rol-app.sql:ro
      # Los catalogos van antes que el perfil normativo: `08` agrega una clave
      # foranea contra `sectors`, que se siembra aca.
      - ./db/03_seed_catalogos.sql:/docker-entrypoint-initdb.d/07-catalogos.sql:ro
      - ./db/08_perfil_normativo.sql:/docker-entrypoint-initdb.d/08-perfil-normativo.sql:ro
      - ./db/09_roles_por_codigo.sql:/docker-entrypoint-initdb.d/09-roles.sql:ro
      - ./db/10_acceso_invitado.sql:/docker-entrypoint-initdb.d/10-acceso-invitado.sql:ro
      - ./db/11_solicitud_de_invitado.sql:/docker-entrypoint-initdb.d/11-solicitud-de-invitado.sql:ro
      - ./db/12_reportabilidad_retc.sql:/docker-entrypoint-initdb.d/12-reportabilidad-retc.sql:ro
      - ./db/13_usuario_interno_con_departamento.sql:/docker-entrypoint-initdb.d/13-usuario-interno-departamento.sql:ro
      - ./db/14_ds90_es_de_la_bcn.sql:/docker-entrypoint-initdb.d/14-ds90-bcn.sql:ro
      - ./db/15_declaracion_ante_su_sistema.sql:/docker-entrypoint-initdb.d/15-declaracion-sistema.sql:ro
      - ./db/16_evidencia_del_articulo.sql:/docker-entrypoint-initdb.d/16-evidencia-articulo.sql:ro
      - ./db/17_avisos_sin_duplicados.sql:/docker-entrypoint-initdb.d/17-avisos-sin-duplicados.sql:ro
      - ./db/18_control_documental.sql:/docker-entrypoint-initdb.d/18-control-documental.sql:ro
      - ./db/19_despacho_de_avisos.sql:/docker-entrypoint-initdb.d/19-despacho-de-avisos.sql:ro
      - ./db/20_plantillas_de_correo.sql:/docker-entrypoint-initdb.d/20-plantillas-de-correo.sql:ro
      - ./db/21_significancia_del_aspecto.sql:/docker-entrypoint-initdb.d/21-significancia-del-aspecto.sql:ro
      - ./db/22_crm.sql:/docker-entrypoint-initdb.d/22-crm.sql:ro
      - ./db/23_normativa_transversal.sql:/docker-entrypoint-initdb.d/23-normativa-transversal.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - interna

  redis:
    image: redis:7-alpine
    restart: always
    # AOF para que las colas del worker sobrevivan un reinicio, y contraseña
    # obligatoria (en dev no la lleva porque no está expuesto).
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?falta REDIS_PASSWORD en .env}
      --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - interna

  api:
    # Backend FastAPI (Python). El Dockerfile corre uvicorn como usuario no-root.
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    environment:
      ENVIRONMENT: production
      PORT: 8000
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CORS_ORIGINS: https://${DOMAIN_WEB:?falta DOMAIN_WEB en .env}
      # Clerk (ADR-006). OBLIGATORIAS en produccion, y por eso van con `:?`.
      #
      # No es una preferencia de estilo: `clerk_configured` en apps/api/app/deps.py
      # se deriva de CLERK_JWKS_URL. Si esta vacia, la API cae al fallback de
      # desarrollo y acepta el header X-Tenant-Id — o sea, cualquiera declara el
      # tenant que quiera y RLS le obedece. Fallar al arrancar es lo correcto.
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:?falta CLERK_JWKS_URL en .env — sin ella la API queda sin autenticacion}
      CLERK_ISSUER: ${CLERK_ISSUER:?falta CLERK_ISSUER en .env}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:?falta CLERK_WEBHOOK_SECRET en .env}
      # La necesita RF-06 para fijar la clave local contra Clerk.
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?falta CLERK_SECRET_KEY en .env}
      # Obligatorio en produccion: sin el, el ingreso de invitados responde 503.
      TOKEN_INVITADO_SECRETO: ${TOKEN_INVITADO_SECRETO:?falta el secreto de firma del acceso de invitado}
      # Almacenamiento de documentos (RF-110). Exigidas: en produccion un
      # control documental que no puede guardar el archivo no sirve, y es
      # mejor que el despliegue falle a que la empresa descubra el 503 al
      # subir su primer procedimiento.
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?falta el endpoint del almacenamiento}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-005}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?falta el nombre del bucket (el NOMBRE, no el ID)}
      STORAGE_KEY_ID: ${STORAGE_KEY_ID:?falta el keyID del almacenamiento}
      STORAGE_KEY: ${STORAGE_KEY:?falta la llave de aplicacion del almacenamiento}
      # Correo transaccional (#122). Ya no es opcional: las notificaciones
      # existen. En produccion un sistema de avisos de vencimiento que no puede
      # mandar correo no cumple su unica funcion, y es mejor que el despliegue
      # falle a que los avisos se acumulen encolados sin que nadie lo note.
      RESEND_API_KEY: ${RESEND_API_KEY:?falta la llave de Resend}
      CORREO_REMITENTE: ${CORREO_REMITENTE:?falta el remitente, con dominio verificado en Resend}
      CORREO_RESPONDER_A: ${CORREO_RESPONDER_A:-}
    # Sin `ports`: el único camino desde internet es a través de Caddy.
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - interna
      - publica

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Se hornean en el bundle del cliente en tiempo de build: cambiarlas
        # exige reconstruir la imagen, no solo reiniciar el contenedor.
        NEXT_PUBLIC_API_URL: https://${DOMAIN_API:?falta DOMAIN_API en .env}/api/v1
        # Sin esta clave el frontend no puede iniciar sesion contra Clerk.
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?falta NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY en .env}
    restart: always
    environment:
      NODE_ENV: production
    depends_on:
      - api
    networks:
      - publica

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN_WEB: ${DOMAIN_WEB}
      DOMAIN_API: ${DOMAIN_API}
      # Let's Encrypt usa este correo para avisar de certificados por expirar.
      ACME_EMAIL: ${ACME_EMAIL:?falta ACME_EMAIL en .env}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Persistir los certificados es CRÍTICO: sin esto, cada redeploy los pide
      # de nuevo y Let's Encrypt aplica rate limit (5 por semana por dominio).
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api
    networks:
      - publica

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  # Postgres y Redis viven solo aquí; ni Caddy ni la web los alcanzan.
  interna:
    internal: true
  publica:
