[pytest]
testpaths = tests
pythonpath = .
# `not red`: las pruebas que salen a internet se saltan por defecto. Hasta el
# 22-sep CLAUDE.md lo decia y no era cierto: corrian siempre, y la suite fallaba
# cuando la BCN estaba lenta. `pytest -m red` las corre (el -m de la linea de
# comandos pisa este).
addopts = -q -m "not red"
markers =
    red: sale a internet (BCN, Ley Chile). Se salta por defecto; correr con -m red
    b2_real: habla con Backblaze de verdad. Opt-in: solo corre con PRUEBA_B2_REAL=1
