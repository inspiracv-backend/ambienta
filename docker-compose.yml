# Entorno de DESARROLLO de Ambienta.
#
#   docker compose up -d          → levanta todo
#   docker compose logs -f api    → sigue los logs de la API
#   docker compose down           → detiene (conserva los datos)
#   docker compose down -v        → detiene Y BORRA la base de datos
#
# URLs una vez arriba:
#   Web       http://localhost:3000
#   API       http://localhost:3001/api/v1
#   Health    http://localhost:3001/health
#   Postgres  postgresql://ambienta:ambienta_dev@localhost:5432/ambienta
#   Redis     redis://localhost:6379
#
# Las credenciales de este archivo son de DESARROLLO LOCAL únicamente y por eso
# están en texto plano: la base solo escucha en localhost y no contiene datos
# reales. Producción usa docker-compose.prod.yml, que exige un .env.

name: ambienta-dev

services:
  postgres:
    # pgvector/pgvector trae la extensión ya compilada; la imagen oficial de
    # postgres no la incluye y habría que compilarla en cada build.
    image: pgvector/pgvector:pg16
    container_name: ambienta-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ambienta
      POSTGRES_PASSWORD: ambienta_dev
      POSTGRES_DB: ambienta
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Los scripts de esta carpeta corren solo al inicializar el volumen.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `-d ambienta` es necesario: sin la base explícita, pg_isready responde
      # OK antes de que la base de la aplicación esté realmente creada.
      test: ['CMD-SHELL', 'pg_isready -U ambienta -d ambienta']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ambienta-redis-dev
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      # Contexto en la raíz: npm workspaces necesita el lockfile completo.
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: ambienta-api-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      # Dentro de la red de Compose se usan los nombres de servicio como host,
      # no localhost (localhost sería el propio contenedor de la API).
      DATABASE_URL: postgresql://ambienta:ambienta_dev@postgres:5432/ambienta
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3000
      # Secreto de desarrollo, deliberadamente obvio para que nadie lo confunda
      # con uno real. Producción lo exige por .env (mín. 32 caracteres).
      JWT_SECRET: dev-only-secret-no-usar-en-produccion-32c
    ports:
      - '3001:3001'
    volumes:
      # Se montan SOLO los directorios de código fuente, nunca la carpeta
      # completa de la app. Así los node_modules instalados en la imagen no
      # quedan tapados por los del host y no hacen falta volúmenes anónimos
      # para protegerlos (esos volúmenes fallan al inicializarse en Docker
      # Desktop para Windows: "failed to chmod ... read-only file system").
      #
      # Contrapartida: cambiar package.json o tsconfig.json exige reconstruir
      # (`docker compose up -d --build api`); cambiar código en src/ recarga solo.
      - ./apps/api/src:/repo/apps/api/src
      - ./packages/shared/src:/repo/packages/shared/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: ambienta-web-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      # El navegador resuelve esta URL, así que es localhost del HOST —
      # no el nombre de servicio de Compose.
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      # Igual que en la API: los eventos inotify no cruzan del host Windows al
      # contenedor, así que webpack debe hacer polling para ver los cambios.
      WATCHPACK_POLLING: 'true'
    ports:
      - '3000:3000'
    volumes:
      # Mismo criterio que la API: solo directorios de código fuente.
      # Como no se monta sobre apps/web completo, `.next` queda en el sistema
      # de archivos del contenedor (rápido) y no requiere volumen propio.
      - ./apps/web/app:/repo/apps/web/app
      - ./apps/web/components:/repo/apps/web/components
      - ./apps/web/lib:/repo/apps/web/lib
      - ./apps/web/mocks:/repo/apps/web/mocks
      - ./packages/shared/src:/repo/packages/shared/src
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
