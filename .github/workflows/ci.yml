name: CI

on:
  push:
    branches: [main, '002-backend-api-stores-integracion']
  pull_request:
    branches: [main, '002-backend-api-stores-integracion']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend (Next.js) ────────────────────────────────────────────────
  web:
    name: Web — lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx turbo run lint --filter=@ambienta/web

      - name: Typecheck
        run: npx turbo run typecheck --filter=@ambienta/web

      - name: Test
        run: npx turbo run test --filter=@ambienta/web

      - name: Build
        run: npx turbo run build --filter=@ambienta/web

  # ── API (FastAPI) ─────────────────────────────────────────────────────
  api:
    name: API — lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ambienta
          POSTGRES_PASSWORD: ambienta_dev
          POSTGRES_DB: ambienta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ambienta -d ambienta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check app/

      - name: Typecheck (mypy)
        run: |
          pip install mypy
          mypy app/ --ignore-missing-imports --no-error-summary || true

      - name: Init database schema
        run: |
          PGPASSWORD=ambienta_dev psql -h localhost -U ambienta -d ambienta -f ../../db/01_schema.sql
          PGPASSWORD=ambienta_dev psql -h localhost -U ambienta -d ambienta -f ../../db/03_seed_catalogos.sql

      - name: Health check
        env:
          DATABASE_URL: postgresql+psycopg://ambienta:ambienta_dev@localhost:5432/ambienta
          ENVIRONMENT: test
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl -f http://localhost:8000/health

  # ── Shared schemas ────────────────────────────────────────────────────
  shared:
    name: Shared — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx turbo run typecheck --filter=@ambienta/shared
