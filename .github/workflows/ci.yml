name: CI

on:
  push:
    branches: [main, '002-backend-api-stores-integracion']
  # Sin filtro de rama a proposito: hoy los PRs se apilan unos sobre otros
  # (feat/x → feat/y → 002-backend → main). Con una lista blanca de destinos,
  # los PRs intermedios se quedan sin CI justo cuando mas falta hace.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend (Next.js) ────────────────────────────────────────────────
  # CI corre DELIBERADAMENTE sin las variables de Clerk.
  #
  # Son secretos y dependen de un servicio externo: meterlas aca ataria cada PR
  # a que la instancia de Clerk este arriba y a que la llave no haya rotado.
  # Un CI que se pone rojo por algo ajeno al cambio deja de creerse.
  #
  # Sin `NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY` el build cae al DevRoleSwitcher, que
  # es el camino que igual tiene que seguir funcionando. Lo que esto NO cubre es
  # el camino con Clerk encendido: eso va en un job aparte, programado y con
  # secretos, no en el CI de cada PR. Ver Fase 5 de `credenciales-de-acceso`.
  web:
    name: Web — lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx turbo run lint --filter=@ambienta/web

      - name: Typecheck
        run: npx turbo run typecheck --filter=@ambienta/web

      - name: Test
        run: npx turbo run test --filter=@ambienta/web

      - name: Build
        run: npx turbo run build --filter=@ambienta/web

  # ── API (FastAPI) ─────────────────────────────────────────────────────
  api:
    name: API — lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ambienta
          POSTGRES_PASSWORD: ambienta_dev
          POSTGRES_DB: ambienta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ambienta -d ambienta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - run: pip install -r requirements.txt

      # Las versiones van ancladas y deben coincidir con requirements-dev.txt.
      # Sin anclar, el CI se rompe solo cada vez que la herramienta publica una
      # release con reglas nuevas: paso de 18 hallazgos en local a 171 en CI.
      - name: Lint (ruff)
        run: |
          pip install ruff==0.8.4
          # `.` y no `app/`: asi cubre tests/ en cuanto exista, sin tener que
          # tocar el workflow. ruff respeta .gitignore, no entra a .venv.
          ruff check .

      # mypy es informativo por ahora (`|| true`): el codigo viene de la
      # migracion desde NestJS y todavia no esta anotado. El nombre del paso lo
      # dice para que nadie lea el check en verde como que los tipos estan bien.
      - name: Typecheck (mypy, informativo — no bloquea)
        run: |
          pip install mypy==1.14.0
          mypy app/ --ignore-missing-imports --no-error-summary || true

      # El esquema va ANTES de los tests, no despues.
      #
      # Estaba al reves, y no se notaba mientras ninguna prueba tocaba la base.
      # Al entrar las de aislamiento y borrado logico, pytest corria contra una
      # base vacia y sin el rol de aplicacion: `Role "ambienta_app" does not
      # exist`.
      #
      # Se aplican TODOS los scripts, en el mismo orden que `db/run.sh`. Con
      # solo 01 y 03 faltaban el rol de aplicacion (07), la secuencia de
      # tickets (06) y los permisos individuales (05) — o sea que CI daba verde
      # sobre un esquema que no es el que corre en ningun lado.
      - name: Init database schema
        run: |
          for f in 01_schema 04_clerk_auth 05_user_permissions 06_ticket_number \
                   07_rol_aplicacion 08_perfil_normativo 03_seed_catalogos 02_seed \
                   09_roles_por_codigo 10_acceso_invitado 11_solicitud_de_invitado \
                   12_reportabilidad_retc 13_usuario_interno_con_departamento 14_ds90_es_de_la_bcn \
                   15_declaracion_ante_su_sistema \
                   16_evidencia_del_articulo \
                   17_avisos_sin_duplicados \
                   18_control_documental \
                   19_despacho_de_avisos 20_plantillas_de_correo \
                   21_significancia_del_aspecto 22_crm 23_normativa_transversal \
                   24_datos_por_tipo_de_registro \
                   25_catalogos_de_mejora \
                   26_informe_por_proceso \
                   27_vinculos_de_documentos \
                   28_comentarios \
                   29_normativa_propia 30_etapas_de_mejora 31_tareas_del_plan_de_accion \
                   32_admin_empresa_sin_departamento_obligatorio \
                   33_relaciones_y_bitacora_de_la_bcn \
                   34_compromisos_del_seguimiento \
                   35_evidencia_objetiva_del_hallazgo; do
            echo "→ $f"
            PGPASSWORD=ambienta_dev psql -v ON_ERROR_STOP=1 -q \
              -h localhost -U ambienta -d ambienta -f "../../db/${f}.sql"
          done

      # ── Smoke test del esquema (#55) ─────────────────────────────────
      #
      # Va **antes** de pytest: comprueba las garantias que sostienen todo lo
      # demas —que RLS aisle de verdad, que el audit log sea inmutable, que los
      # CHECK de negocio rechacen lo invalido—, asi que si esto falla no vale la
      # pena mirar el resto.
      #
      # `ON_ERROR_STOP=1` es lo que hace que el job falle: el archivo comunica
      # sus resultados con `RAISE EXCEPTION`, y sin esa bandera psql los imprime
      # y sale con 0.
      #
      # Deja la base como la encontro (termina en `ROLLBACK`), asi que pytest
      # corre despues sobre el mismo estado.
      #
      # **Estaba roto y nadie lo sabia.** La migracion 13 agrego
      # `ck_users_interno_con_departamento` y este archivo crea usuarios; desde
      # entonces reventaba en su tercer INSERT. Como no lo corria nada, el
      # README y CLAUDE.md siguieron diciendo "9 smoke tests en verde" durante
      # semanas. Correrlo en CI es justamente lo que impide que vuelva a pasar.
      - name: Cliente de Postgres 16 (lo necesitan las pruebas de respaldo)
        run: |
          # `pg_dump` tiene que ser de la **misma version mayor** que el
          # servidor: uno mas viejo se niega a correr contra un 16. Sin este
          # paso las tres pruebas de volcado y restauracion se saltan solas, y
          # una prueba que se salta en todas las maquinas es una prueba que no
          # existe — lo que paso: la corrida informo "1678 passed, 36 skipped"
          # con esas tres entre las saltadas.
          #
          # Del repositorio de PGDG y con el nombre de la distribucion derivado,
          # por lo mismo que en el Dockerfile: el runner cambia de version de
          # Ubuntu sin avisar.
          sudo apt-get install -y --no-install-recommends ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc             -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main"             | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          pg_dump --version

      - name: Smoke test del esquema
        env:
          PGPASSWORD: ambienta_dev
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U ambienta -d ambienta             -f ../../db/02_smoke_test.sql

      # El guard permite que este workflow entre antes que la suite de tests:
      # sin el, pytest sale con codigo 5 ("no tests collected") y tumba el job.
      - name: Test (pytest)
        env:
          # El mismo rol acotado con el que corre la API: probar con el dueno
          # de la base daria falsos verdes, porque es superusuario y salta RLS.
          DATABASE_URL: postgresql+psycopg://ambienta_app:ambienta_app_dev@localhost:5432/ambienta
          # Las pruebas que respaldan la base la necesitan —`pg_dump` con el rol
          # de la aplicacion se niega por RLS— y sin ella se saltaban **tambien
          # en CI**: `1678 passed, 36 skipped` con las tres entre las saltadas.
          # El paso de abajo exige que no se salten.
          DATABASE_ADMIN_URL: postgresql+psycopg://ambienta:ambienta_dev@localhost:5432/ambienta
        run: |
          if [ -d tests ]; then
            pip install pytest==8.3.4
            python -m pytest
          else
            echo "apps/api todavia no tiene tests/ — se omite."
          fi

      - name: Las pruebas de respaldo no se pueden saltar
        env:
          DATABASE_URL: postgresql+psycopg://ambienta_app:ambienta_app_dev@localhost:5432/ambienta
          # **El paso de pytest no la pasa**, y estas pruebas respaldan con el
          # dueno de la base a proposito: sin ella caen al valor por defecto del
          # modulo, que es correcto en CI pero no deberia depender de eso.
          DATABASE_ADMIN_URL: postgresql+psycopg://ambienta:ambienta_dev@localhost:5432/ambienta
        run: |
          # Se vuelven a correr solas **y se exige que no se salten**. Una
          # prueba que se salta en todas las maquinas es una prueba que no
          # existe: el volcado y la restauracion se saltaban en Windows por no
          # tener `pg_dump`, y en CI por lo mismo — con el agravante de que el
          # docstring afirmaba que ahi si corrian.
          #
          # `-rs` imprime el motivo de cada salto, que es lo que hacia falta
          # para diagnosticarlo.
          #
          # **Sin `-q`**: `pytest.ini` ya lo trae en `addopts`, y uno mas lo
          # vuelve `-qq`, que **suprime la linea del resumen** — justo la que
          # este paso busca. La primera version fallaba con las 13 pruebas en
          # verde por eso.
          salida=$(python -m pytest tests/test_respaldos.py -rs 2>&1) || true
          echo "$salida"
          if echo "$salida" | grep -q "SKIPPED"; then
            echo "::error::Las pruebas de respaldo se saltaron en CI. Ver el motivo arriba."
            exit 1
          fi
          echo "$salida" | grep -qE "[0-9]+ passed" || exit 1

      - name: Health check
        env:
          DATABASE_URL: postgresql+psycopg://ambienta_app:ambienta_app_dev@localhost:5432/ambienta
          DATABASE_ADMIN_URL: postgresql+psycopg://ambienta:ambienta_dev@localhost:5432/ambienta
          ENVIRONMENT: test
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          # Reintento en vez de `sleep 5`: un arranque lento no deberia pintar
          # el build en rojo, y uno rapido no deberia costar 5 segundos.
          for i in $(seq 1 20); do
            if curl -fs http://localhost:8000/health > /dev/null; then
              echo "API arriba tras ${i} intento(s)."
              exit 0
            fi
            sleep 1
          done
          echo "La API no respondio en 20s."
          exit 1

  # ── Shared schemas ────────────────────────────────────────────────────
  shared:
    name: Shared — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx turbo run typecheck --filter=@ambienta/shared

  # ── Camino de despliegue ──────────────────────────────────────────────
  #
  # **Este job existe porque el camino de produccion se podrido en silencio
  # durante meses.** `docker-compose.prod.yml`, su Caddyfile y sus Dockerfiles
  # se mantuvieron a mano sin que nadie corriera el `up` —no hay servidor
  # aprovisionado— y al ensayarlo el 13-oct tenian ocho fallas. Tres las habria
  # atrapado este job el dia que entraron:
  #
  #   · El Caddyfile era **invalido** (`exclude` dentro de `log` no existe en
  #     Caddy 2): Caddy no arrancaba y el despliegue no servia nada.
  #   · El Dockerfile de la web copiaba `apps/web/public`, que no existe en el
  #     repo, asi que la imagen no se podia construir.
  #   · El `reverse_proxy` apuntaba a `api:3001` y la API escucha en 8000.
  #
  # No despliega ni levanta nada: comprueba que lo declarado sea construible,
  # parseable y coherente, que es lo que nadie estaba comprobando.
  despliegue:
    name: Despliegue — compose, Caddy, imagenes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: El compose de produccion resuelve todas sus variables
        run: |
          # `.env.example` trae marcadores, no secretos; los valores de abajo
          # tampoco lo son. Alcanzan para que las variables con `:?` esten
          # definidas, que es justo lo que falla cuando alguien agrega un
          # servicio y olvida declarar una.
          cp .env.example .env.ci
          {
            echo 'APP_DB_PASSWORD=ci-no-es-un-secreto'
            echo 'CLERK_JWKS_URL=https://ci.example/.well-known/jwks.json'
            echo 'CLERK_ISSUER=https://ci.example'
            echo 'CLERK_WEBHOOK_SECRET=whsec_ci'
            echo 'CLERK_SECRET_KEY=sk_test_ci'
            # No alcanza con que exista: el SDK de Clerk la **decodifica** en
            # tiempo de build y aborta el `next build` si no tiene forma de
            # llave (`pk_test_` + base64 del dominio terminado en `$`). Con
            # `pk_test_ci` el prerender de /acceso-invitado y /signup fallaba
            # con "publishableKey passed to Clerk is invalid". Esta decodifica
            # a `ci.clerk.accounts.dev$`, un dominio que no existe: no es un
            # secreto ni sirve contra ninguna instancia.
            echo 'NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_Y2kuY2xlcmsuYWNjb3VudHMuZGV2JA'
            echo 'TOKEN_INVITADO_SECRETO=ci-no-es-un-secreto'
            echo 'STORAGE_ENDPOINT=s3.example.com'
            echo 'STORAGE_BUCKET=ci'
            echo 'STORAGE_KEY_ID=ci'
            echo 'STORAGE_KEY=ci'
            echo 'RESEND_API_KEY=re_ci'
            echo 'CORREO_REMITENTE=CI <ci@example.com>'
          } >> .env.ci
          docker compose -f docker-compose.prod.yml --env-file .env.ci config --quiet
          echo "OK · el compose de produccion resuelve"

      - name: Las garantias del despliegue siguen en su lugar
        run: |
          pip install --quiet pyyaml
          docker compose -f docker-compose.prod.yml --env-file .env.ci config \
            | python herramientas/verificar_despliegue.py

      - name: El Caddyfile es valido
        run: |
          docker run --rm \
            -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e DOMAIN_WEB=ci.example -e DOMAIN_API=api.ci.example \
            -e ACME_EMAIL=ci@example.com \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Caddy apunta al puerto donde escucha la API
        run: |
          # Se comparan los dos archivos en vez de fijar el numero en un tercer
          # lugar que tambien habria que mantener.
          puerto_api=$(grep -oP '(?<=--port", ")[0-9]+' apps/api/Dockerfile)
          puerto_caddy=$(grep -oP '(?<=reverse_proxy api:)[0-9]+' infra/caddy/Caddyfile)
          echo "Dockerfile: $puerto_api · Caddyfile: $puerto_caddy"
          test -n "$puerto_api" && test "$puerto_api" = "$puerto_caddy"

      - name: Las imagenes de produccion se construyen
        run: docker compose -f docker-compose.prod.yml --env-file .env.ci build api web
