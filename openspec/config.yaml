schema: spec-driven

context: |
  Ambienta — cumplimiento ambiental multi-tenant para industria en Chile.

  Stack: Next.js 14 (App Router, Atomic Design) · FastAPI + SQLAlchemy 2.0 ·
  PostgreSQL 16 + pgvector · Turborepo. Monolito modular, no microservicios:
  una sola base, sin bus de eventos, y los limites entre dominios se sostienen
  por convencion en el codigo, no por infraestructura.

  Autenticacion: Clerk (ADR-006). Clerk autentica; los permisos y la
  pertenencia a la empresa son nuestros.

  Aislamiento multi-tenant: RLS en PostgreSQL es la UNICA barrera. Ninguna
  consulta de la aplicacion filtra por tenant_id — ni CRUDBase ni un solo
  router. La API se conecta con el rol ambienta_app, que no puede saltarse
  RLS, y declara la empresa por transaccion. 38 de 52 tablas llevan politica;
  las otras 14 son catalogo compartido (la ley es igual para todos).

  Consecuencia al disenar: un endpoint que olvide declarar la empresa devuelve
  CERO filas, no todas. Falla cerrado, en silencio. Y las FK de Postgres NO
  pasan por RLS, asi que cualquier referencia cruzada editable hay que
  validarla leyendo el destino con la sesion del tenant.

  Idioma: la prosa va en espanol. Las palabras que el CLI parsea —SHALL,
  GIVEN, WHEN, THEN, los encabezados ADDED/MODIFIED/REMOVED— van en ingles.

  Dominio: ISO 9001 e ISO 14001, RETC, Ley REP, SINADER, SIDREP, DAE. Los
  requisitos citan el articulo de la norma cuando corresponde.

rules:
  proposal:
    - Incluir siempre una tabla de que exige el cambio del resto del sistema.
    - Incluir las decisiones que requiere el equipo, como preguntas abiertas.
  design:
    - Contratos y modelo, no codigo de implementacion copiado.
    - Cada decision lleva su porque, y que se pierde con la alternativa.
  tasks:
    - Separar los supuestos vigentes de los que hay que confirmar.
    - Fase 0 para los prerequisitos que estan fuera del modulo.

operations:
  apply:
    guidance:
      - Leer el modelo real antes de codear; si contradice el diseno, corregir
        design.md antes de seguir. Ya paso con compliance_answer e is_active.
      - Verificar los tests rompiendo a proposito lo que dicen proteger.
  archive:
    guidance:
      - Completar el Purpose del spec vivo; el CLI lo deja en TBD.

